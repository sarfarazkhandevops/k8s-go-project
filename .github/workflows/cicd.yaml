name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "go-web-app-chart/values.yaml"

permissions:
  contents: write

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: |
          go version
          go build ./...

      - name: Run tests
        run: |
          go test ./...


  # =========================
  # CODE QUALITY
  # =========================
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install golint
        run: |
          go install golang.org/x/lint/golint@latest

      - name: Run code quality checks
        run: |
          go vet ./...
          golint ./...


  # =========================
  # DOCKER BUILD & PUSH
  # =========================
  push:
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}

      - name: Show Docker image
        run: |
          echo "Docker image pushed:"
          echo "${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}"


  # =========================
  # UPDATE HELM IMAGE TAG
  # =========================
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs:
      - push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update Helm image tag
        run: |
          NEW_TAG="${{ github.run_id }}"

          echo "New Docker image tag: ${NEW_TAG}"

          yq -i '.image.tag = strenv(NEW_TAG)' go-web-app-chart/values.yaml

          echo "Updated Helm values:"
          cat go-web-app-chart/values.yaml

      - name: Verify Helm image tag
        run: |
          echo "Helm image repository:"
          yq '.image.repository' go-web-app-chart/values.yaml

          echo "Helm image tag:"
          yq '.image.tag' go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add go-web-app-chart/values.yaml

          git commit \
            -m "Update Helm image tag: ${{ github.run_id }} [skip ci]" \
            || echo "No changes to commit"

          git push origin main
